<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قوتابخانەی گزنگ - ئامادەبوون</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* شێوازی گشتی بۆ فۆنت و ئاراستەی دەق */
        body { 
            font-family: 'Noto Sans Arabic', sans-serif; 
            background-color: #f0f4f8; 
            transition: all 0.3s ease; 
            min-height: 100vh;
        }
        
        /* شێوازی بارگۆڕینی سەرەوە */
        #navigation {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 50;
            padding: 1rem 0 0 0;
            background-color: transparent;
        }
        #app {
            width: 100%;
            padding-top: 6rem; 
        }

        /* شێوازی کارتی مامۆستا */
        body:not(.admin-mode) #app {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 6rem); 
            padding-top: 2rem; 
            padding-bottom: 2rem;
        }
        .teacher-card-style {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 90%;
            max-width: 400px;
            text-align: center;
            border-top: 6px solid #ff9800;
        }
        .teacher-logo-style {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            background-color: white;
        }
        .teacher-logo-style img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 5px;
        }
        .teacher-h2-style {
            color: #2d3436;
            margin: 10px 0 5px;
            font-size: 22px;
            font-weight: 700;
        }
        .teacher-p-style {
            color: #636e72;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* دوگمەکانی هەڵبژاردن */
        .btn-group-select {
            display: flex;
            gap: 12px;
        }
        .btn-in { background-color: #27ae60; box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3); }
        .btn-out { background-color: #e74c3c; box-shadow: 0 4px 10px rgba(231, 76, 60, 0.3); }
        .btn-select-style {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.1s;
            color: white;
        }

        .input-field { border: 2px solid #dfe6e9; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .input-field:focus { border-color: #ff9800; background-color: #fff; outline: none; }

        .input-field.teacher-select-style {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 12px;
            font-size: 15px;
            background-color: #fafafa;
            border: 2px solid #dfe6e9;
        }
        
        .tiny-footer {
            margin-top: 1.5rem; 
            font-size: 9px; 
            opacity: 0.6; 
            letter-spacing: 0.5px;
            font-weight: 500;
            text-align: center;
        }

        /* شێوازی بەشی ئەدمین */
        body.admin-mode { background-color: #1e293b; color: #f1f5f9; }
        .admin-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(148, 163, 184, 0.1); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }
        .admin-mode .input-field { background-color: #1e293b; border-color: #334155; color: white; }
        .admin-mode .bg-white { background-color: #334155 !important; }
        .admin-mode .text-gray-800 { color: #f1f5f9 !important; }

        /* خشتەی ڕاپۆرت */
        .report-table th { background-color: #f9fafb; color: #1f2937; padding: 12px; border: 1px solid #e5e7eb; }
        .admin-mode .report-table th { background-color: #475569; color: #f1f5f9; border-color: #475569; }
        .report-table td { padding: 12px; border: 1px solid #e5e7eb; }
        .admin-mode .report-table td { border-color: #475569; }
        .report-table { border-collapse: collapse; }
        
        .time-entry { color: #27ae60; font-weight: bold; }
        .time-exit { color: #e74c3c; font-weight: bold; }

        #custom-alert {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            padding: 1rem 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            display: none;
            font-weight: bold;
        }
    </style>
</head>
<body class="min-h-screen">
    <div id="custom-alert"></div>

    <script>
        // لینک بەستەرەکە لێرەدایە
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwq_J4VSLm2PH_fD_Hdc3B0OLO4S4T8advLXC-G2kgCVHH1V7EEpwG5sN0XBoYRhfhT/exec";
        
        let state = {
            currentView: 'teacher', 
            isAdminAuthenticated: false,
            teachers: [
                "دیدەن عبدالرحمن اسماعیل بیروت", "حکیم حمد رسول عبداللە", "سارێژ خضر حمد رسول", 
                "کانیاو ناصر حسن احمد", "بەهار حمدامین رحمن ابوبکر", "میهناز عمر ابراهیم عبداللە", 
                "اسمر لقمان احمد قادر", "سەفین محمدامین عثمان حمد", "بەهێز قادر مصطفی عبدالقادر", 
                "زانیار مغدید محمد رسول", "سۆنیا فریاد عزیز مصطفی", "ئاشتی محسین سعید صوفی", 
                "ئه‌یوب مغدید محمد", "نەرمین فارس اسماعیل علی", "کاروان عبدالرحمن اسماعیل بیروت", 
                "دیلان طالب بیروت محمود", "بەهرە احمد قادر محمدامین", "چرۆ مرشد مصطفى عزیز", 
                "مەستان عبداللە قادر اورحمان", "محمد ایوب رسول مصطفی", "نیگار اسود احمد حمد", 
                "کارا همداد رفیق سعید", "شاهۆز ابراهیم احمد نبی", "ئێران شێخە قادر رسول"
            ],
            attendanceData: [], 
            login: { username: '', password: '' },
            report: {
                period: 'daily', 
                date: new Date().toISOString().split('T')[0]
            },
            teacherName: ''
        };

        const TEACHERS_LIST = state.teachers.map(name => `<option value="${name}">${name}</option>`).join('');

        function showAlert(text, type = 'info') {
            const alertEl = document.getElementById('custom-alert');
            alertEl.innerText = text;
            alertEl.style.display = 'block';
            if (type === 'error') {
                alertEl.style.backgroundColor = '#fee2e2';
                alertEl.style.color = '#991b1b';
            } else {
                alertEl.style.backgroundColor = '#dcfce7';
                alertEl.style.color = '#166534';
            }
            setTimeout(() => { alertEl.style.display = 'none'; }, 3000);
        }

        function convertToCSV(data) {
            const header = ["ناوی مامۆستا", "بەروار", "ڕۆژ", "کاتی هاتن", "کاتی ڕۆیشتن"];
            const rows = data.map(row => [
                row.teacherName,
                formatDateForDisplay(row.date),
                getKurdishDay(row.date),
                row.entryTime || 'نادیار',
                row.exitTime || 'نادیار' 
            ]);
            return [header, ...rows];
        }

        function downloadExcel(data, filename) {
            if (!Array.isArray(data) || data.length === 0) {
                showAlert("⚠️ ناتوانیت فایلەکە دابەزێنیت چونکە هیچ تۆمارێک نییە.", "error");
                return;
            }
            const ws = XLSX.utils.aoa_to_sheet(convertToCSV(data));
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "ڕاپۆرتی ئامادەبوون");
            const safeFilename = filename.replace(/[^a-z0-9]/gi, '_'); 
            XLSX.writeFile(wb, safeFilename + ".xlsx");
        }

        function getKurdishDay(dateString) {
            let date;
            try {
                 if (dateString.includes('/')) {
                    const parts = dateString.split('/');
                    date = new Date(parts[2], parts[0] - 1, parts[1]);
                } else if (dateString.includes('-')) {
                    const parts = dateString.split('-');
                    date = new Date(parts[0], parts[1] - 1, parts[2]);
                } else return "نادیار";
                if (isNaN(date.getTime())) return "نادیار";
                const days = ["یەکشەممە", "دووشەممە", "سێشەممە", "چوارشەممە", "پێنجشەممە", "هەینی", "شەممە"];
                return days[date.getDay()];
            } catch (e) { return "نادیار"; }
        }
        
        function formatDateForDisplay(dateString) {
            try {
                const parts = dateString.split('/');
                const date = new Date(parts[2], parts[0] - 1, parts[1]);
                return date.toLocaleDateString('ku-IQ', { day: 'numeric', month: 'long', year: 'numeric' });
            } catch (e) { return dateString; }
        }

        function getTimeInMinutes(date) {
            return date.getHours() * 60 + date.getMinutes();
        }
        
        async function loadAttendanceData() {
            if (state.currentView === 'teacher' && state.isAdminAuthenticated === false) return; 
            showLoading("وەرگرتنی داتای ڕاپۆرت...");
            try {
                const response = await fetch(`${WEB_APP_URL}?action=get`); 
                const data = await response.json();
                state.attendanceData = (data && Array.isArray(data)) ? data : [];
            } catch (error) {
                console.error("Error loading data:", error);
                document.getElementById('loadingText').innerText = "کێشە لە وەرگرتنی داتا ڕوویدا.";
                setTimeout(hideLoading, 2000);
            } finally {
                hideLoading();
                render();
            }
        }

        async function submitData(teacherName, type) {
            var messageDiv = document.getElementById(`message-general`); 
            if (!teacherName || teacherName === '') {
                showMessage(messageDiv, "⚠️ تکایە سەرەتا ناوی خۆت هەڵبژێرە!", "error");
                return;
            }

            var now = new Date();
            var currentTime = getTimeInMinutes(now);
            const ENTRY_START = 7 * 60 + 30; // 07:30
            const ENTRY_END = 10 * 60;       // 10:00
            const EXIT_START = 10 * 60;      // 10:00
            const EXIT_END = 19 * 60;        // 19:00 (کاتژمێر 07:00ی ئێوارە)

            if (type === 'هاتن' && (currentTime < ENTRY_START || currentTime >= ENTRY_END)) {
                showMessage(messageDiv, "⛔ کاتی تۆمارکردنی هاتن: 07:30 تا 10:00 بەیانییە.", "error");
                return;
            } else if (type === 'ڕۆیشتن' && (currentTime < EXIT_START || currentTime >= EXIT_END)) {
                showMessage(messageDiv, "⛔ کاتی تۆمارکردنی ڕۆیشتن: 10:00 تا 07:00ی ئێوارەیە.", "error");
                return;
            }
            
            showMessage(messageDiv, "⏳ ...تکایە چاوەڕێ بە", "pending");
            var formData = new FormData();
            formData.append("teacherName", teacherName);
            formData.append("type", type);

            try {
                const response = await fetch(WEB_APP_URL, { method: "POST", body: formData });
                const data = await response.text();
                if (data.includes("SUCCESS")) {
                    const time = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
                    showMessage(messageDiv, `✅ بەڕێز <b>${teacherName}</b><br>تۆماری <b>${type}</b> سەرکەوتوو بوو.<br>کات: ${time}`, "success");
                    setTimeout(() => { messageDiv.style.display = "none"; state.teacherName = ''; render(); }, 5000);
                } else {
                    showMessage(messageDiv, "❌ کێشە لە تۆمارکردن ڕوویدا.", "error");
                }
            } catch (error) { showMessage(messageDiv, "❌ کێشە لە پەیوەندی: " + error.message, "error"); }
        }

        function showMessage(el, text, type) {
            el.style.display = "block";
            let baseStyle = "margin-top: 20px; padding: 12px; border-radius: 10px; font-size: 14px; text-align: right;";
            if (type === 'success') {
                el.style.cssText = baseStyle + " background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb;";
            } else if (type === 'error') {
                el.style.cssText = baseStyle + " background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;";
            } else {
                el.style.cssText = baseStyle + " background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba;";
            }
            el.innerHTML = text;
        }

        function showLoading(text) {
            const overlay = document.getElementById('loadingOverlay');
            document.getElementById('loadingText').innerText = text;
            overlay.classList.remove('hidden', 'opacity-0');
            overlay.classList.add('opacity-100');
        }

        function hideLoading() {
            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.replace('opacity-100', 'opacity-0');
            setTimeout(() => overlay.classList.add('hidden'), 300);
        }
        
        async function handleLogin() {
            const { username, password } = state.login;
            if (!username || !password) {
                showAlert("تکایە هەردوو خانەکە پڕ بکەرەوە.", "error");
                return;
            }
            showLoading("پشکنینی زانیاری...");
            try {
                const formData = new FormData();
                formData.append("action", "login");
                formData.append("username", username);
                formData.append("password", password);
                const response = await fetch(WEB_APP_URL, { method: 'POST', body: formData });
                const result = await response.text();
                if (result.includes("SUCCESS")) { 
                    state.isAdminAuthenticated = true;
                    state.login = { username: '', password: '' };
                    await loadAttendanceData(); 
                } else {
                    showAlert("ناوی بەکارهێنەر یان وشەی نهێنی هەڵەیە!", "error");
                    hideLoading();
                }
            } catch (error) {
                showAlert("کێشە لە پەیوەندی ڕوویدا.", "error");
                hideLoading();
            }
        }
        
        function handleLogout() {
            state.isAdminAuthenticated = false;
            state.currentView = 'teacher';
            render();
        }

        function getFilteredData() {
            const selectedDateStr = state.report.date; 
            let startDate, endDate, filtered = [];

            if (state.report.period === 'daily') {
                const parts = selectedDateStr.split('-'); 
                const formattedDate = `${parts[1]}/${parts[2]}/${parts[0]}`; 
                filtered = state.attendanceData.filter(item => item.date === formattedDate);
            } else if (state.report.period === 'yearly') {
                const selectedYear = selectedDateStr.split('-')[0];
                filtered = state.attendanceData.filter(item => {
                    const yearOfItem = item.date.split('/')[2];
                    return yearOfItem === selectedYear;
                });
            } else {
                const today = new Date(selectedDateStr);
                if (state.report.period === 'weekly') {
                    startDate = new Date(today);
                    startDate.setDate(today.getDate() - ((today.getDay() + 1) % 7));
                    endDate = new Date(startDate);
                    endDate.setDate(startDate.getDate() + 6);
                } else {
                    const year = parseInt(selectedDateStr.split('-')[0]);
                    const month = parseInt(selectedDateStr.split('-')[1]) - 1; 
                    startDate = new Date(year, month, 1);
                    endDate = new Date(year, month + 1, 0); 
                }
                filtered = state.attendanceData.filter(item => {
                    const dateParts = item.date.split('/');
                    const itemDate = new Date(dateParts[2], dateParts[0] - 1, dateParts[1]);
                    return itemDate >= startDate && itemDate <= endDate;
                });
            }
            return filtered.sort((a, b) => {
                const da = new Date(a.date.split('/')[2], a.date.split('/')[0]-1, a.date.split('/')[1]);
                const db = new Date(b.date.split('/')[2], b.date.split('/')[0]-1, b.date.split('/')[1]);
                return db - da;
            });
        }
        
        function renderTeacherView() {
            return `
            <div class="teacher-card-style" id="teacher-view">
                <div class="teacher-logo-style">
                    <img src="https://i.ibb.co/7xTBmQJ8/logo-gzng.png" alt="Gzng Logo">
                </div>
                <h2 class="teacher-h2-style">قوتابخانەی بنەڕەتی گزنگ</h2>
                <p class="teacher-p-style">تۆمارکردنی ئامادەبوونی مامۆستایان</p>
                <select id="teacherName" onchange="state.teacherName = this.value" class="input-field teacher-select-style">
                    <option value="" disabled ${state.teacherName === '' ? 'selected' : ''}>🔽 ناوی خۆت هەڵبژێرە...</option>
                    ${TEACHERS_LIST}
                </select>
                <div class="btn-group-select">
                    <button type="button" class="btn-select-style btn-in" onclick="submitData(state.teacherName, 'هاتن')">🟢 هاتن</button>
                    <button type="button" class="btn-select-style btn-out" onclick="submitData(state.teacherName, 'ڕۆیشتن')">🔴 ڕۆیشتن</button>
                </div>
                <div id="message-general" style="display:none;"></div>
                <div class="tiny-footer">Developed by Tahir Tahir</div>
            </div>`;
        }

        function renderAdminLogin() {
            return `
            <div class="admin-card max-w-sm mx-auto p-8 rounded-3xl text-center my-20">
                <h2 class="text-3xl font-black text-white mb-6">چوونەژوورەوەی ئەدمین</h2>
                <div class="space-y-4">
                    <input type="text" placeholder="ناوی بەکارهێنەر" oninput="state.login.username = this.value" class="input-field w-full rounded-xl px-5 py-3 text-center font-bold">
                    <input type="password" placeholder="وشەی نهێنی" oninput="state.login.password = this.value" class="input-field w-full rounded-xl px-5 py-3 text-center font-bold">
                    <button onclick="handleLogin()" class="w-full bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-black py-3 rounded-xl transition text-lg mt-4">چوونەژوورەوە</button>
                </div>
            </div>`;
        }
        
        function renderAdminView() {
            const filteredData = getFilteredData();
            let dateInputHtml = '';
            
            if (state.report.period === 'yearly') {
                // بۆ ساڵانە تەنها لیستێکی ساڵەکان نیشان دەدەین
                const currentYear = new Date().getFullYear();
                let options = '';
                for(let y = currentYear; y >= 2023; y--) {
                    options += `<option value="${y}-01-01" ${state.report.date.startsWith(y) ? 'selected' : ''}>${y}</option>`;
                }
                dateInputHtml = `<select onchange="state.report.date = this.value; render()" class="input-field w-full rounded-xl px-4 py-3 bg-gray-700 text-white font-bold text-center">${options}</select>`;
            } else {
                dateInputHtml = `<input type="${state.report.period === 'monthly' ? 'month' : 'date'}" onchange="state.report.date = this.value; render()" value="${state.report.date}" class="input-field w-full rounded-xl px-4 py-3 bg-gray-700 text-white text-center">`;
            }

            return `
            <div class="max-w-7xl mx-auto px-4 py-8">
                <div class="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
                    <h1 class="text-3xl font-black text-white">🗄️ پانێڵی ئەدمین</h1>
                    <button onclick="handleLogout()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-xl transition">دەرچوون</button>
                </div>
                <div class="admin-card rounded-xl p-6 mb-8">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                        <div>
                            <label class="block text-sm font-bold mb-2 text-gray-300">ماوەی ڕاپۆرت</label>
                            <select onchange="state.report.period = this.value; render()" class="input-field w-full rounded-xl px-4 py-3 bg-gray-700 text-white font-bold">
                                <option value="daily" ${state.report.period === 'daily' ? 'selected' : ''}>ڕۆژانە</option>
                                <option value="weekly" ${state.report.period === 'weekly' ? 'selected' : ''}>هەفتانە</option>
                                <option value="monthly" ${state.report.period === 'monthly' ? 'selected' : ''}>مانگانە</option>
                                <option value="yearly" ${state.report.period === 'yearly' ? 'selected' : ''}>ساڵانە</option>
                            </select>
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-sm font-bold mb-2 text-gray-300">هەڵبژاردنی کات</label>
                            ${dateInputHtml}
                        </div>
                    </div>
                    <button onclick="downloadExcel(getFilteredData(), 'ڕاپۆرتی_ئامادەبوون')" class="w-full bg-green-500 hover:bg-green-600 text-white font-black py-3 rounded-xl transition flex items-center justify-center gap-2">
                        دابەزاندنی ڕاپۆرتی ئەم ماوەیە (Excel)
                        <span class="bg-white text-green-500 px-2 py-0.5 rounded-full text-xs font-black">${filteredData.length}</span>
                    </button>
                </div>
                <div class="admin-card rounded-xl overflow-hidden shadow-lg">
                    <div class="overflow-x-auto">
                        <table class="report-table w-full text-right text-sm">
                            <thead>
                                <tr>
                                    <th class="w-12 text-center">#</th>
                                    <th>ناوی مامۆستا</th>
                                    <th>بەروار</th>
                                    <th>ڕۆژ</th>
                                    <th>هاتن</th>
                                    <th>ڕۆیشتن</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${filteredData.length === 0 ? `<tr><td colspan="6" class="text-center py-6 text-gray-400">هیچ تۆمارێک بۆ ئەم ماوەیە نییە.</td></tr>` : filteredData.map((item, index) => `
                                    <tr class="hover:bg-gray-700/50">
                                        <td class="text-center text-gray-400">${index + 1}</td>
                                        <td class="font-bold text-white">${item.teacherName}</td>
                                        <td>${formatDateForDisplay(item.date)}</td>
                                        <td>${getKurdishDay(item.date)}</td>
                                        <td class="time-entry">${item.entryTime || '-'}</td>
                                        <td class="time-exit">${item.exitTime || '-'}</td>
                                    </tr>`).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>`;
        }

        function render() {
            const app = document.getElementById('app');
            const nav = document.getElementById('navigation');
            document.body.classList.toggle('admin-mode', state.currentView === 'admin');
            nav.innerHTML = `
                <div class="max-w-7xl mx-auto px-4">
                    <div class="flex gap-4 justify-center bg-white ${state.currentView === 'admin' ? 'admin-card' : 'shadow'} rounded-2xl p-2">
                        <button onclick="state.currentView='teacher'; render()" class="w-1/2 md:w-auto px-6 py-3 rounded-xl font-bold ${state.currentView === 'teacher' ? 'bg-orange-500 text-white' : 'bg-gray-100 text-gray-700'}">مامۆستا</button>
                        <button onclick="state.currentView='admin'; render()" class="w-1/2 md:w-auto px-6 py-3 rounded-xl font-bold ${state.currentView === 'admin' ? (state.isAdminAuthenticated ? 'bg-yellow-500 text-gray-900' : 'bg-red-500 text-white') : 'bg-gray-100 text-gray-700'}">ئەدمین</button>
                    </div>
                </div>`;
            app.innerHTML = (state.currentView === 'admin' && !state.isAdminAuthenticated) ? renderAdminLogin() : (state.currentView === 'admin' ? renderAdminView() : renderTeacherView());
            if (state.currentView === 'teacher' && document.getElementById('teacherName')) document.getElementById('teacherName').value = state.teacherName;
        }

        function initializeApp() {
            document.body.innerHTML += `
                <div id="navigation"></div><div id="app"></div>
                <div id="loadingOverlay" class="hidden fixed inset-0 bg-gray-900/80 z-[9999] flex flex-col items-center justify-center opacity-0 transition-opacity">
                    <div class="animate-spin rounded-full h-12 w-12 border-4 border-yellow-500 border-t-transparent mb-4"></div>
                    <p id="loadingText" class="text-white font-bold">چاوەڕێ بە...</p>
                </div>`;
            render(); 
            loadAttendanceData(); 
        }
        document.addEventListener('DOMContentLoaded', initializeApp);
    </script>
</body>
</html>
